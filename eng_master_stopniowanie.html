      { id: '92', en: 'Boots are heavier than shoes.', pl: 'Buty zimowe są cięższe niż półbuty.' },

      { id: '97', en: 'A fork is sharper than a spoon.', pl: 'Widelec jest ostrzejszy niż łyżka.' },
      { id: '98', en: 'A plate is wider than a cup.', pl: 'Talerz jest szerszy niż kubek.' },
      { id: '99', en: 'Milk is sweeter than water.', pl: 'Mleko jest słodsze niż woda.' },
      { id: '100', en: 'Practice makes you better.', pl: 'Praktyka czyni cię lepszym.' }
    ];

    function Logo({ isMobileView }) {
      return (
        <div className="flex items-center gap-2.5">
          <div className={`${isMobileView ? 'w-9 h-9' : 'w-12 h-12'} rounded-xl bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-600 p-0.5 shadow-lg flex items-center justify-center transition-all`}>
            <div className="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center relative overflow-hidden">
              <svg viewBox="0 0 100 100" className={isMobileView ? 'w-6 h-6' : 'w-9 h-9'}>
                <path d="M 15,30 Q 35,22 50,35 Q 65,22 85,30 L 85,75 Q 65,67 50,80 Q 35,67 15,75 Z" fill="#1e293b" stroke="#a855f7" strokeWidth="3"/>
                <path d="M 50,35 L 50,80" stroke="#a855f7" strokeWidth="3"/>
                <text x="50" y="32" fontFamily="system-ui" fontWeight="900" fontSize="20" fill="#a855f7" textAnchor="middle">BEST</text>
              </svg>
            </div>
          </div>
          <div>
            <h1 className={`${isMobileView ? 'text-xs sm:text-sm' : 'text-sm sm:text-base'} font-black tracking-tight text-white flex items-center gap-1 flex-wrap`}>
              Angielski Master: <span className="text-purple-400">Good * Better * The Best</span>
            </h1>
            <p className={`${isMobileView ? 'text-[9px]' : 'text-[11px]'} text-slate-400 font-medium`}>Seria: Językowy Master</p>
          </div>
        </div>
      );
    }

    function App() {
      const [words, setWords] = useState(() => {
        const saved = localStorage.getItem('amb_words');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.length > 0) return parsed;
          } catch(e) {}
        }
        return INITIAL_WORDS;
      });

      const [isMobileView, setIsMobileView] = useState(() => {
        const saved = localStorage.getItem('amb_mobile_view');
        return saved ? JSON.parse(saved) : false;
      });

      useEffect(() => {
        localStorage.setItem('amb_mobile_view', JSON.stringify(isMobileView));
      }, [isMobileView]);

      const [fileLastModified, setFileLastModified] = useState('');
      const [loadMessage, setLoadMessage] = useState(null);
      const [activeTab, setActiveTab] = useState('flashcards');
      const [searchTerm, setSearchTerm] = useState('');

      // Stan dla Fiszek Stopniowania
      const [shuffledCards, setShuffledCards] = useState([]);
      const [fcIndex, setFcIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      // Stan dla Ćwiczenia Stopniowania
      const [quizIndex, setQuizIndex] = useState(0);
      const [shuffledQuiz, setShuffledQuiz] = useState([]);
      const [userComp, setUserComp] = useState('');
      const [userSup, setUserSup] = useState('');
      const [quizResult, setQuizResult] = useState(null);
      const [score, setScore] = useState(0);

      // Stan dla Modułu: 100 zdań poziomu 5 klasy
      const [webSentences, setWebSentences] = useState(INITIAL_WEB_SENTENCES);
      const [shuffledWebSentences, setShuffledWebSentences] = useState([]);
      const [webIndex, setWebIndex] = useState(0);
      const [userWebInput, setUserWebInput] = useState('');
      const [webResult, setWebResult] = useState(null);
      const [webScore, setWebScore] = useState(0);

      const voicesRef = useRef([]);

      useEffect(() => {
        try {
          if (document.lastModified) {
            const modDate = new Date(document.lastModified);
            if (!isNaN(modDate)) {
              setFileLastModified(modDate.toLocaleString('pl-PL', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }));
            } else {
              setFileLastModified(document.lastModified);
            }
          }
        } catch(e) {
          setFileLastModified('Brak danych');
        }

        const loadVoices = () => {
          if ('speechSynthesis' in window) {
            voicesRef.current = window.speechSynthesis.getVoices();
          }
        };
        loadVoices();
        if ('speechSynthesis' in window) {
          window.speechSynthesis.onvoiceschanged = loadVoices;
        }
      }, []);

      const normalizeText = (text) => {
        return (text || '').toLowerCase().trim().replace(/[.,!?]/g, '').replace(/\s+/g, ' ');
      };

      const shuffleArray = (arr) => {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      };

      const speakText = (text) => {
        if (!text) return;
        const cleanText = text.split(/[\/,;]/)[0].trim();
        try {
          const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(cleanText)}&tl=en&client=tw-ob`;
          const audio = new Audio(ttsUrl);
          audio.play().catch(() => {
            fallbackSpeak(cleanText, 'en-GB');
          });
        } catch (e) {
          fallbackSpeak(cleanText, 'en-GB');
        }
      };

      const fallbackSpeak = (text, lang) => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 0.92;
        const voices = voicesRef.current.length > 0 ? voicesRef.current : window.speechSynthesis.getVoices();
        const matchingVoices = voices.filter(v => v.lang.toLowerCase().includes(lang.slice(0, 2).toLowerCase()));
        if (matchingVoices.length > 0) {
          utterance.voice = matchingVoices[0];
        }
        window.speechSynthesis.speak(utterance);
      };

      useEffect(() => {
        localStorage.setItem('amb_words', JSON.stringify(words));
      }, [words]);

      useEffect(() => {
        if (words.length > 0) {
          setShuffledCards(shuffleArray(words));
          setShuffledQuiz(shuffleArray(words));
          setFcIndex(0);
          setQuizIndex(0);
        }
        if (webSentences.length > 0) {
          setShuffledWebSentences(shuffleArray(webSentences));
          setWebIndex(0);
        }
      }, [words, webSentences]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const currentCard = shuffledCards.length > 0 ? shuffledCards[fcIndex % shuffledCards.length] : null;
      const currentQuizItem = shuffledQuiz.length > 0 ? shuffledQuiz[quizIndex % shuffledQuiz.length] : null;
      const currentWebItem = shuffledWebSentences.length > 0 ? shuffledWebSentences[webIndex % shuffledWebSentences.length] : null;

      const handleCheckQuiz = (e) => {
        e.preventDefault();
        if (!currentQuizItem || quizResult !== null) return;

        const normCompUser = normalizeText(userComp);
        const normSupUser = normalizeText(userSup);

        const normCompCorrect = normalizeText(currentQuizItem.comparative);
        const normSupCorrect = normalizeText(currentQuizItem.superlative);

        const isCompOk = normCompUser === normCompCorrect;
        const isSupOk = normSupUser === normSupCorrect;

        if (isCompOk && isSupOk) {
          setQuizResult('correct');
          setScore(prev => prev + 1);
        } else {
          setQuizResult('incorrect');
        }
      };

      const handleNextQuiz = () => {
        setUserComp('');
        setUserSup('');
        setQuizResult(null);
        setQuizIndex(prev => prev + 1);
      };

      const handleCheckWeb = (e) => {
        e.preventDefault();
        if (!currentWebItem || webResult !== null) return;

        const userVal = normalizeText(userWebInput);
        const correctVal = normalizeText(currentWebItem.en);

        if (userVal === correctVal) {
          setWebResult('correct');
          setWebScore(prev => prev + 1);
        } else {
          setWebResult('incorrect');
        }
      };

      const handleNextWeb = () => {
        setUserWebInput('');
        setWebResult(null);
        setWebIndex(prev => prev + 1);
      };

      const filteredWords = words.filter(w => 
        w.base.toLowerCase().includes(searchTerm.toLowerCase()) || 
        w.pl.toLowerCase().includes(searchTerm.toLowerCase()) ||
        w.comparative.toLowerCase().includes(searchTerm.toLowerCase()) ||
        w.superlative.toLowerCase().includes(searchTerm.toLowerCase())
      );

      return (
        <div className={`min-h-[100dvh] w-full bg-slate-950 flex flex-col items-center justify-between ${isMobileView ? 'p-1.5 max-w-sm mx-auto text-xs' : 'p-2 sm:p-4'} text-slate-100 transition-all`}>
          <header className={`w-full ${isMobileView ? 'max-w-sm p-2.5' : 'max-w-5xl p-4'} bg-slate-900 rounded-2xl shadow-xl border border-slate-800 mb-3 flex justify-between items-center transition-all`}>
            <Logo isMobileView={isMobileView} />
            <div className="flex items-center gap-2">
              <button
                onClick={() => setIsMobileView(!isMobileView)}
                title={isMobileView ? "Wyłącz tryb mobilny" : "Włącz tryb mobilny (kompaktowy)"}
                className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl border text-xs font-bold transition ${isMobileView ? 'bg-purple-600 text-white border-purple-500' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'}`}
              >
                <i data-lucide={isMobileView ? "smartphone" : "monitor"} className="w-3.5 h-3.5"></i>
                <span className="hidden sm:inline">{isMobileView ? "Tryb Tel. ON" : "Tryb Tel."}</span>
              </button>
              <div className={`${isMobileView ? 'text-[10px]' : 'text-xs'} text-slate-400 text-right`}>
                <div>Przymiotników: <span className="text-purple-400 font-bold">{words.length}</span></div>
              </div>
            </div>
          </header>

          <div className={`w-full ${isMobileView ? 'max-w-sm' : 'max-w-5xl'} flex-1 flex flex-col transition-all`}>
            <div className={`bg-slate-900 ${isMobileView ? 'p-2.5' : 'p-3 sm:p-5'} rounded-2xl shadow-xl border border-slate-800 flex-1 w-full flex flex-col mb-2 transition-all`}>
              
              {/* Nawigacja */}
              <nav className={`grid grid-cols-5 ${isMobileView ? 'gap-0.5 mb-3 p-1 text-[8px]' : 'gap-1.5 sm:gap-2 mb-6 p-1.5 text-[10px] sm:text-xs'} bg-slate-950 rounded-xl font-medium border border-slate-800/80 transition-all text-center`}>
                <button onClick={() => setActiveTab('flashcards')} className={`py-2 rounded-lg flex flex-col items-center justify-center gap-0.5 ${activeTab === 'flashcards' ? 'bg-slate-800 text-purple-400 font-bold border border-slate-700' : 'text-slate-400'}`}>
                  <i data-lucide="layers" className="w-3.5 h-3.5"></i><span>Fiszki</span>
                </button>
                <button onClick={() => setActiveTab('exercise')} className={`py-2 rounded-lg flex flex-col items-center justify-center gap-0.5 ${activeTab === 'exercise' ? 'bg-slate-800 text-purple-400 font-bold border border-slate-700' : 'text-slate-400'}`}>
                  <i data-lucide="check-circle" className="w-3.5 h-3.5"></i><span>Stopniowanie</span>
                </button>
                <button onClick={() => setActiveTab('webSentences')} className={`py-2 rounded-lg flex flex-col items-center justify-center gap-0.5 ${activeTab === 'webSentences' ? 'bg-slate-800 text-purple-400 font-bold border border-slate-700' : 'text-slate-400'}`}>
                  <i data-lucide="book-open-check" className="w-3.5 h-3.5"></i><span>Zdania (Poziom 5 SP)</span>
                </button>
                <button onClick={() => setActiveTab('rules')} className={`py-2 rounded-lg flex flex-col items-center justify-center gap-0.5 ${activeTab === 'rules' ? 'bg-slate-800 text-purple-400 font-bold border border-slate-700' : 'text-slate-400'}`}>
                  <i data-lucide="book-open" className="w-3.5 h-3.5"></i><span>Rules</span>
                </button>
                <button onClick={() => setActiveTab('admin')} className={`py-2 rounded-lg flex flex-col items-center justify-center gap-0.5 ${activeTab === 'admin' ? 'bg-slate-800 text-purple-400 font-bold border border-slate-700' : 'text-slate-400'}`}>
                  <i data-lucide="database" className="w-3.5 h-3.5"></i><span>Słownik</span>
                </button>
              </nav>

              {loadMessage && (
                <div className="mb-3 p-2.5 bg-purple-950/80 border border-purple-800 text-purple-200 text-xs rounded-xl">{loadMessage}</div>
              )}

              {/* 1. MODUŁ: FISZKI STOPNIOWANIA */}
              {activeTab === 'flashcards' && (
                <div className="flex-1 flex flex-col items-center justify-between space-y-4">
                  <div className="text-center text-xs text-slate-400">
                    Fiszka stopniowania przymiotników (Stopień równy ➔ Wyższy ➔ Najwyższy)
                  </div>

                  {shuffledCards.length > 0 && currentCard ? (
                    <div className="w-full max-w-md flex-1 flex flex-col items-center justify-center my-2">
                      <div onClick={() => setIsFlipped(!isFlipped)} className={`w-full ${isMobileView ? 'min-h-[210px] p-5' : 'min-h-[280px] p-8'} rounded-3xl bg-gradient-to-br ${isFlipped ? 'from-slate-950 to-slate-900 border border-purple-800/60 text-white' : 'from-purple-700 to-indigo-800 text-white'} shadow-2xl flex flex-col items-center justify-between cursor-pointer text-center transition-all`}>
                        <div className="w-full flex justify-between items-center text-xs opacity-80">
                          <span>{isFlipped ? 'Stopniowanie i znaczenie' : 'Stopień równy (Base)'}</span>
                          <span>{(fcIndex % shuffledCards.length) + 1} z {shuffledCards.length}</span>
                        </div>
                        <div className="my-auto space-y-2">
                          <h2 className={`${isMobileView ? 'text-3xl' : 'text-4xl'} font-extrabold uppercase tracking-wide`}>{currentCard.base}</h2>
                          <p className="text-xs text-slate-300 font-medium">({currentCard.pl})</p>
                          
                          {isFlipped && (
                            <div className="pt-3 border-t border-purple-500/30 space-y-1.5 animate-fade-in">
                              <div className="text-xs text-purple-200 font-semibold">Stopień wyższy (Comparative): <span className="text-white font-bold">{currentCard.comparative}</span></div>
                              <div className="text-xs text-purple-200 font-semibold">Stopień najwyższy (Superlative): <span className="text-white font-bold">{currentCard.superlative}</span></div>
                            </div>
                          )}
                        </div>
                        <div className="flex items-center gap-2">
                          <button onClick={(e) => { e.stopPropagation(); speakText(currentCard.base); }} className="p-2 bg-black/30 rounded-full text-white hover:bg-black/50 transition" title="Posłuchaj bazowego">
                            <i data-lucide="volume-2" className="w-4 h-4"></i>
                          </button>
                          {isFlipped && (
                            <button onClick={(e) => { e.stopPropagation(); speakText(currentCard.comparative + '. ' + currentCard.superlative); }} className="p-2 bg-black/30 rounded-full text-white hover:bg-black/50 transition" title="Posłuchaj stopniowania">
                              <i data-lucide="mic" className="w-4 h-4"></i>
                            </button>
                          )}
                        </div>
                      </div>
                      <div className="flex items-center gap-3 mt-4">
                        <button onClick={() => { setIsFlipped(false); setFcIndex(prev => Math.max(0, prev - 1)); }} className="p-2.5 bg-slate-800 text-slate-200 rounded-xl"><i data-lucide="chevron-left" className="w-4 h-4"></i></button>
                        <button onClick={() => { setIsFlipped(false); setFcIndex(prev => prev + 1); }} className="px-5 py-2.5 bg-purple-600 text-white rounded-xl font-semibold text-xs sm:text-sm shadow">Następna ➔</button>
                      </div>
                    </div>
                  ) : <div className="text-slate-500 text-sm my-auto">Brak przymiotników w bazie.</div>}
                </div>
              )}

              {/* 2. MODUŁ: ĆWICZENIE STOPNIOWANIA */}
              {activeTab === 'exercise' && (
                <div className="flex-1 flex flex-col items-center justify-between space-y-4 max-w-md mx-auto w-full">
                  <div className="w-full flex justify-between items-center text-xs text-slate-400 font-semibold px-1">
                    <span>Ćwiczenie Stopniowania Przymiotników</span>
                    <span>Wynik: <span className="text-purple-400">{score}</span></span>
                  </div>

                  {shuffledQuiz.length > 0 && currentQuizItem ? (
                    <div className="w-full my-auto space-y-4 bg-slate-950/80 p-5 rounded-2xl border border-slate-800">
                      <div className="text-center space-y-1">
                        <div className="text-xs text-purple-400 font-bold uppercase tracking-wider">Przymiotnik wyjściowy:</div>
                        <h2 className="text-2xl font-extrabold text-white">{currentQuizItem.base}</h2>
                        <p className="text-xs text-slate-400">Znaczenie: <span className="text-slate-200 font-semibold">{currentQuizItem.pl}</span></p>
                      </div>

                      <form onSubmit={handleCheckQuiz} className="space-y-3 pt-2">
                        <div>
                          <label className="text-[11px] text-slate-300 font-semibold block mb-1">Stopień wyższy (Comparative):</label>
                          <input
                            type="text"
                            placeholder="np. bigger / more expensive..."
                            value={userComp}
                            disabled={quizResult !== null}
                            onChange={(e) => setUserComp(e.target.value)}
                            className="w-full px-3 py-2 bg-slate-900 border border-slate-700 text-white rounded-xl text-sm font-medium"
                          />
                        </div>
                        <div>
                          <label className="text-[11px] text-slate-300 font-semibold block mb-1">Stopień najwyższy (Superlative):</label>
                          <input
                            type="text"
                            placeholder="np. the biggest / the most expensive..."
                            value={userSup}
                            disabled={quizResult !== null}
                            onChange={(e) => setUserSup(e.target.value)}
                            className="w-full px-3 py-2 bg-slate-900 border border-slate-700 text-white rounded-xl text-sm font-medium"
                          />
                        </div>

                        {quizResult === null ? (
                          <button type="submit" className="w-full py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-semibold rounded-xl text-sm shadow transition">Sprawdź odpowiedź</button>
                        ) : (
                          <div className="space-y-2.5 pt-1">
                            {quizResult === 'correct' ? (
                              <div className="p-3 rounded-xl text-center text-xs font-semibold bg-emerald-950 text-emerald-300 border border-emerald-800">
                                Bravissimo! Odpowiedź całkowicie poprawna!
                              </div>
                            ) : (
                              <div className="p-3 rounded-xl text-center text-xs font-semibold bg-red-950 text-red-300 border border-red-800 space-y-1">
                                <div>Błędnie! Prawidłowe formy to:</div>
                                <div className="text-slate-100 font-bold">{currentQuizItem.comparative} | {currentQuizItem.superlative}</div>
                              </div>
                            )}
                            <button type="button" onClick={handleNextQuiz} className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-xl text-sm transition">Następny przymiotnik ➔</button>
                          </div>
                        )}
                      </form>
                    </div>
                  ) : <div className="text-slate-500 text-sm my-auto">Brak przymiotników do ćwiczeń.</div>}
                </div>
              )}

              {/* 3. MODUŁ: ZDANIA POZIOM 5 KLASA SP */}
              {activeTab === 'webSentences' && (
                <div className="flex-1 flex flex-col items-center justify-between space-y-4 max-w-lg mx-auto w-full">
                  <div className="w-full flex justify-between items-center text-xs text-slate-400 font-semibold px-1">
                    <span>Zdania porównawcze (Poziom 5 klasa SP)</span>
                    <span>Wynik: <span className="text-purple-400">{webScore}</span></span>
                  </div>

                  {shuffledWebSentences.length > 0 && currentWebItem ? (
                    <div className="w-full my-auto space-y-4 bg-slate-950/80 p-5 rounded-2xl border border-slate-800">
                      <div className="text-center space-y-2">
                        <div className="text-xs text-purple-400 font-bold uppercase tracking-wider">Przetłumacz na język angielski:</div>
                        <div className="text-base font-bold text-white bg-slate-900 p-3.5 rounded-xl border border-slate-800">
                          „{currentWebItem.pl}”
                        </div>
                        <p className="text-[11px] text-slate-400 italic">Użyj stopni wyższych i słówka „than”</p>
                      </div>

                      <form onSubmit={handleCheckWeb} className="space-y-3 pt-1">
                        <input
                          type="text"
                          placeholder="Wpisz zdanie po angielsku..."
                          value={userWebInput}
                          disabled={webResult !== null}
                          onChange={(e) => setUserWebInput(e.target.value)}
                          className="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 text-white rounded-xl text-sm font-medium text-center"
                        />

                        {webResult === null ? (
                          <button type="submit" className="w-full py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-semibold rounded-xl text-sm shadow transition">Sprawdź zdanie</button>
                        ) : (
                          <div className="space-y-2.5 pt-1">
                            {webResult === 'correct' ? (
                              <div className="p-3 rounded-xl text-center text-xs font-semibold bg-emerald-950 text-emerald-300 border border-emerald-800 flex items-center justify-center gap-2">
                                <span>Świetnie! Idealne tłumaczenie!</span>
                                <button type="button" onClick={() => speakText(currentWebItem.en)} className="text-emerald-300 hover:text-white" title="Posłuchaj">
                                  <i data-lucide="volume-2" className="w-4 h-4"></i>
                                </button>
                              </div>
                            ) : (
                              <div className="p-3 rounded-xl text-center text-xs font-semibold bg-red-950 text-red-300 border border-red-800 space-y-1">
                                <div>Niezupełnie. Wzorcowe zdanie to:</div>
                                <div className="text-slate-100 font-bold flex items-center justify-center gap-2">
                                  <span>{currentWebItem.en}</span>
                                  <button type="button" onClick={() => speakText(currentWebItem.en)} className="text-red-200 hover:text-white" title="Posłuchaj">
                                    <i data-lucide="volume-2" className="w-4 h-4"></i>
                                  </button>
                                </div>
                              </div>
                            )}
                            <button type="button" onClick={handleNextWeb} className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-xl text-sm transition">Następne zdanie ➔</button>
                          </div>
                        )}
                      </form>
                    </div>
                  ) : <div className="text-slate-500 text-sm my-auto">Brak zdań w bazie.</div>}
                </div>
              )}

              {/* 4. MODUŁ: SPELLING RULES */}
              {activeTab === 'rules' && (
                <div className="flex-1 flex flex-col space-y-4 max-w-2xl mx-auto w-full text-xs custom-scrollbar overflow-y-auto max-h-[65dvh] p-1">
                  <div className="bg-slate-950 p-4 rounded-2xl border border-purple-900/50 space-y-3">
                    <h2 className="text-sm font-bold text-purple-400 uppercase tracking-wider flex items-center gap-2">
                      <i data-lucide="book-open" className="w-4 h-4"></i>
                      <span>Spelling Rules & Grammar (Zasady z załącznika)</span>
                    </h2>

                    <div className="space-y-3 text-slate-300 leading-relaxed">
                      <div className="p-3 bg-slate-900 rounded-xl border border-slate-800 space-y-1">
                        <span className="font-bold text-white block">1. Krótkie przymiotniki regularne (Podwajanie spółgłoski)</span>
                        <p>W krótkich przymiotnikach, które kończą się spółgłoską poprzedzoną jedną samogłoską, **podwajamy ostatnią spółgłoskę**.</p>
                        <p className="text-purple-300 font-mono text-[11px]">Przykład: big ➔ bigger ➔ the biggest</p>
                      </div>

                      <div className="p-3 bg-slate-900 rounded-xl border border-slate-800 space-y-1">
                        <span className="font-bold text-white block">2. Przymiotniki zakończone na literę -y</span>
                        <p>W krótkich przymiotnikach, które kończą się literą **-y**, zmieniamy **-y na -i** i dodajemy końcówki *-er / -est*.</p>
                        <p className="text-purple-300 font-mono text-[11px]">Przykład: happy ➔ happier ➔ the happiest</p>
                      </div>

                      <div className="p-3 bg-slate-900 rounded-xl border border-slate-800 space-y-1">
                        <span className="font-bold text-white block">3. Przymiotniki zakończone na literę -e</span>
                        <p>W przymiotnikach kończących się literą **-e** dodajemy tylko **-r** w stopniu wyższym i **-st** w stopniu najwyższym.</p>
                        <p className="text-purple-300 font-mono text-[11px]">Przykład: safe ➔ safer ➔ the safest</p>
                      </div>

                      <div className="p-3 bg-slate-900 rounded-xl border border-slate-800 space-y-1">
                        <span className="font-bold text-white block">4. Przymiotniki długie (Long adjectives)</span>
                        <p>W przypadku dłuższych przymiotników (część dwusylabowych i trzysylabowych) stopień najwyższy tworzymy, dodając **the most** przed przymiotnikiem (a stopień wyższy przez **more**).</p>
                        <p className="text-purple-300 font-mono text-[11px]">Przykład: expensive ➔ more expensive ➔ the most expensive</p>
                      </div>

                      <div className="p-3 bg-slate-900 rounded-xl border border-slate-800 space-y-1">
                        <span className="font-bold text-white block">5. Przymiotniki nieregularne (Irregular adjectives)</span>
                        <p>**Good** i **bad** są przymiotnikami nieregularnymi, które stopniujemy zupełnie inaczej niż pozostałe przymiotniki.</p>
                        <p className="text-purple-300 font-mono text-[11px]">Przykład: good ➔ better ➔ the best<br/>bad ➔ worse ➔ the worst</p>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* 5. MODUŁ: SŁOWNIK / ADMIN */}
              {activeTab === 'admin' && (
                <div className="space-y-4 flex-1 flex flex-col max-w-xl mx-auto w-full text-xs">
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                    <h3 className="font-bold text-white flex items-center justify-between">
                      <span>Baza przymiotników ({words.length} pozycji)</span>
                    </h3>
                    <input
                      type="text"
                      placeholder="Szukaj w słowniku..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 text-white rounded-lg text-xs"
                    />
                    <div className="max-h-[220px] overflow-y-auto border border-slate-800 rounded-lg bg-slate-900/50 custom-scrollbar">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-slate-900 border-b border-slate-800 sticky top-0 text-slate-400 uppercase">
                          <tr>
                            <th className="p-2">Base</th>
                            <th className="p-2">Comparative</th>
                            <th className="p-2">Superlative</th>
                            <th className="p-2">PL</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800">
                          {filteredWords.map((item) => (
                            <tr key={item.id} className="hover:bg-slate-800/40">
                              <td className="p-2 font-semibold text-white flex items-center gap-1">
                                <span>{item.base}</span>
                                <button onClick={() => speakText(item.base)} className="text-slate-500 hover:text-purple-400">
                                  <i data-lucide="volume-2" className="w-3 h-3"></i>
                                </button>
                              </td>
                              <td className="p-2 text-purple-300 font-medium">{item.comparative}</td>
                              <td className="p-2 text-indigo-300 font-medium">{item.superlative}</td>
                              <td className="p-2 text-slate-300">{item.pl}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

            </div>
          </div>

          <footer className={`w-full ${isMobileView ? 'max-w-sm' : 'max-w-5xl'} text-center py-1.5 text-[9px] text-slate-500 font-medium space-y-0.5 transition-all`}>
            <div>Ostatnia aktualizacja kodu (plik): <span className="text-slate-400 font-semibold">{fileLastModified}</span></div>
            <div>Baza danych: <span className="text-purple-400 font-semibold">100 przymiotników + 100 zdań (Poziom 5 SP)</span></div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
