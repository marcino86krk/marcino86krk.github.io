<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Językowy Master</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; min-height: 100dvh; overflow-x: hidden; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #334155; border-radius: 9999px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Konfiguracja kafelków aplikacji ze spadkowymi i dynamicznymi logotypami SVG z nagłówków
    const APPS_CONFIG = [
      {
        id: 'eng',
        title: 'Angielski Master Junior',
        defaultVersion: '1.0',
        url: 'https://marcino86krk.github.io/eng_master_junior.html',
        gradient: 'from-blue-600 via-indigo-600 to-red-600',
        borderColor: 'border-blue-500/40 hover:border-blue-500',
        badgeBg: 'bg-blue-950/80 text-blue-300 border-blue-800',
        isCompact: false,
        description: 'Ucz się słówek, zwrotów i gramatyki języka angielskiego w nowoczesnym interaktywnym środowisku.',
        // Oryginalne logo SVG z nagłówka aplikacji eng_master_junior.html
        logoSvg: (
          <svg viewBox="0 0 100 100" className="w-full h-full p-1.5">
            <path d="M 15,30 Q 35,22 50,35 Q 65,22 85,30 L 85,75 Q 65,67 50,80 Q 35,67 15,75 Z" fill="#1e293b" stroke="#3b82f6" strokeWidth="3"/>
            <path d="M 50,35 L 50,80" stroke="#3b82f6" strokeWidth="3"/>
            <line x1="23" y1="42" x2="41" y2="47" stroke="#94a3b8" strokeWidth="3" strokeLinecap="round"/>
            <line x1="23" y1="52" x2="38" y2="57" stroke="#94a3b8" strokeWidth="3" strokeLinecap="round"/>
            <line x1="59" y1="42" x2="77" y2="47" stroke="#ef4444" strokeWidth="3" strokeLinecap="round"/>
            <line x1="59" y1="52" x2="74" y2="57" stroke="#94a3b8" strokeWidth="3" strokeLinecap="round"/>
            <text x="50" y="30" fontFamily="system-ui" fontWeight="900" fontSize="22" fill="#3b82f6" textAnchor="middle">EN</text>
          </svg>
        )
      },
      {
        id: 'esp',
        title: 'Hiszpański Master',
        defaultVersion: '1.8',
        url: 'https://marcino86krk.github.io/esp_master.html',
        gradient: 'from-red-600 via-amber-500 to-yellow-400',
        borderColor: 'border-red-500/40 hover:border-red-500',
        badgeBg: 'bg-red-950/80 text-red-300 border-red-800',
        isCompact: false,
        description: 'Odkrywaj słoneczny język hiszpański! Fiszki, quizy, szybkie testy i pełna odmiana czasowników.',
        // Oryginalne logo SVG z nagłówka aplikacji esp_master.html
        logoSvg: (
          <svg viewBox="0 0 100 100" className="w-full h-full p-1.5">
            <path d="M 15,30 Q 35,22 50,35 Q 65,22 85,30 L 85,75 Q 65,67 50,80 Q 35,67 15,75 Z" fill="#1e293b" stroke="#f59e0b" strokeWidth="3"/>
            <path d="M 50,35 L 50,80" stroke="#f59e0b" strokeWidth="3"/>
            <line x1="23" y1="42" x2="41" y2="47" stroke="#94a3b8" strokeWidth="3" strokeLinecap="round"/>
            <line x1="23" y1="52" x2="38" y2="57" stroke="#94a3b8" strokeWidth="3" strokeLinecap="round"/>
            <line x1="59" y1="42" x2="77" y2="47" stroke="#ef4444" strokeWidth="3" strokeLinecap="round"/>
            <line x1="59" y1="52" x2="74" y2="57" stroke="#94a3b8" strokeWidth="3" strokeLinecap="round"/>
            <text x="50" y="30" fontFamily="system-ui" fontWeight="900" fontSize="24" fill="#ef4444" textAnchor="middle">Ñ</text>
          </svg>
        )
      },
      {
        id: 'eng_stopniowanie',
        title: 'Angielski Master: Good * Better * The Best',
        defaultVersion: '1.0',
        url: 'https://marcino86krk.github.io/eng_master_stopniowanie.html',
        gradient: 'from-indigo-600 via-purple-600 to-pink-600',
        borderColor: 'border-purple-500/40 hover:border-purple-500',
        badgeBg: 'bg-purple-950/80 text-purple-300 border-purple-800',
        isCompact: true,
        badgeTag: 'STOPNIOWANIE',
        description: 'Praktyczny moduł treningowy ze stopniowania przymiotników i przysłówków po angielsku.',
        // Oryginalne logo SVG z nagłówka aplikacji eng_master.html (Good * Better * The Best)
        logoSvg: (
          <svg viewBox="0 0 100 100" className="w-full h-full p-1.5">
            <path d="M 15,30 Q 35,22 50,35 Q 65,22 85,30 L 85,75 Q 65,67 50,80 Q 35,67 15,75 Z" fill="#1e293b" stroke="#a855f7" strokeWidth="3"/>
            <path d="M 50,35 L 50,80" stroke="#a855f7" strokeWidth="3"/>
            <text x="50" y="32" fontFamily="system-ui" fontWeight="900" fontSize="20" fill="#a855f7" textAnchor="middle">BEST</text>
          </svg>
        )
      }
    ];

    function MasterLogo({ isMobileView }) {
      return (
        <div className="flex items-center gap-2.5">
          <div className={`${isMobileView ? 'w-9 h-9' : 'w-12 h-12'} rounded-xl bg-gradient-to-br from-blue-600 via-purple-600 to-red-600 p-0.5 shadow-lg flex items-center justify-center transition-all`}>
            <div className="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center relative overflow-hidden">
              <svg viewBox="0 0 100 100" className={isMobileView ? 'w-6 h-6' : 'w-9 h-9'}>
                <path d="M 15,30 Q 35,22 50,35 Q 65,22 85,30 L 85,75 Q 65,67 50,80 Q 35,67 15,75 Z" fill="#1e293b" stroke="#a855f7" strokeWidth="3"/>
                <path d="M 50,35 L 50,80" stroke="#a855f7" strokeWidth="3"/>
                <line x1="23" y1="42" x2="41" y2="47" stroke="#94a3b8" strokeWidth="3" strokeLinecap="round"/>
                <line x1="59" y1="42" x2="77" y2="47" stroke="#ef4444" strokeWidth="3" strokeLinecap="round"/>
                <text x="50" y="30" fontFamily="system-ui" fontWeight="900" fontSize="22" fill="#a855f7" textAnchor="middle">JM</text>
              </svg>
            </div>
          </div>
          <div>
            <h1 className={`${isMobileView ? 'text-sm' : 'text-lg'} font-black tracking-tight text-white flex items-center gap-1`}>
              JĘZYKOWY MASTER <span className="text-purple-500">HUB</span>
            </h1>
            <p className={`${isMobileView ? 'text-[9px]' : 'text-[11px]'} text-slate-400 font-medium`}>Portal Aplikacji Edukacyjnych</p>
          </div>
        </div>
      );
    }

    function App() {
      const [isMobileView, setIsMobileView] = useState(() => {
        const saved = localStorage.getItem('jm_hub_mobile_view');
        return saved ? JSON.parse(saved) : false;
      });

      const [appVersions, setAppVersions] = useState({
        eng: '1.0',
        esp: '1.8',
        eng_stopniowanie: '1.0'
      });

      useEffect(() => {
        localStorage.setItem('jm_hub_mobile_view', JSON.stringify(isMobileView));
      }, [isMobileView]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // Próba odczytania numerów wersji z nagłówków stron poprzez proxy
      useEffect(() => {
        APPS_CONFIG.forEach(async (app) => {
          try {
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(app.url)}`;
            const res = await fetch(proxyUrl);
            if (res.ok) {
              const text = await res.text();
              const parser = new DOMParser();
              const doc = parser.parseFromString(text, 'text/html');
              
              const titleOrH1 = doc.querySelector('title')?.textContent || doc.querySelector('h1')?.textContent || '';
              const match = titleOrH1.match(/(\d+\.\d+)/);
              if (match) {
                setAppVersions(prev => ({ ...prev, [app.id]: match[1] }));
              }
            }
          } catch (e) {
            // W razie braku połączenia wykorzystujemy predefiniowane wersje fallbackowe
          }
        });
      }, []);

      return (
        <div className={`min-h-[100dvh] w-full bg-slate-950 flex flex-col items-center justify-between ${isMobileView ? 'p-1.5 max-w-sm mx-auto text-xs' : 'p-2 sm:p-6'} text-slate-100 transition-all`}>
          
          {/* Header */}
          <header className={`w-full ${isMobileView ? 'max-w-sm p-2.5' : 'max-w-4xl p-4'} bg-slate-900 rounded-2xl shadow-xl border border-slate-800 mb-4 flex justify-between items-center transition-all`}>
            <MasterLogo isMobileView={isMobileView} />
            <div className="flex items-center gap-2">
              <button
                onClick={() => setIsMobileView(!isMobileView)}
                title={isMobileView ? "Wyłącz tryb mobilny" : "Włącz tryb mobilny (kompaktowy)"}
                className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl border text-xs font-bold transition ${isMobileView ? 'bg-purple-600 text-white border-purple-500' : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'}`}
              >
                <i data-lucide={isMobileView ? "smartphone" : "monitor"} className="w-3.5 h-3.5"></i>
                <span className="hidden sm:inline">{isMobileView ? "Tryb Tel. ON" : "Tryb Tel."}</span>
              </button>
            </div>
          </header>

          {/* Main Content */}
          <main className={`w-full ${isMobileView ? 'max-w-sm' : 'max-w-4xl'} flex-1 flex flex-col justify-center my-auto transition-all`}>
            <div className="text-center mb-6 space-y-2">
              <h2 className={`${isMobileView ? 'text-xl' : 'text-3xl sm:text-4xl'} font-black text-white tracking-tight`}>
                Wybierz aplikację językową
              </h2>
              <p className={`${isMobileView ? 'text-xs' : 'text-sm sm:text-base'} text-slate-400 max-w-lg mx-auto font-medium`}>
                Rozpocznij naukę słówek, quizów oraz gramatyki w wybranym języku.
              </p>
            </div>

            {/* Główne 2 duże kafelki */}
            <div className={`grid grid-cols-1 ${isMobileView ? 'gap-3' : 'sm:grid-cols-2 gap-5'} w-full mb-4`}>
              {APPS_CONFIG.filter(app => !app.isCompact).map((app) => (
                <div 
                  key={app.id} 
                  className={`bg-slate-900 border ${app.borderColor} rounded-3xl ${isMobileView ? 'p-4' : 'p-6 sm:p-7'} shadow-2xl flex flex-col justify-between transition-all duration-300 group hover:-translate-y-1`}
                >
                  <div>
                    {/* Górny pasek kafelka */}
                    <div className="flex items-center justify-between mb-4">
                      <div className="flex items-center gap-3">
                        <div className={`w-12 h-12 rounded-2xl bg-gradient-to-br ${app.gradient} p-0.5 shadow-lg flex items-center justify-center shrink-0`}>
                          <div className="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center overflow-hidden">
                            {app.logoSvg}
                          </div>
                        </div>
                        <div>
                          <h3 className="font-extrabold text-white text-base sm:text-lg tracking-tight group-hover:text-purple-400 transition">
                            {app.title}
                          </h3>
                          <span className={`inline-block px-2 py-0.5 mt-0.5 rounded-md border text-[10px] font-bold ${app.badgeBg}`}>
                            Wersja {appVersions[app.id]}
                          </span>
                        </div>
                      </div>
                    </div>

                    {/* Opis */}
                    <p className="text-slate-400 text-xs sm:text-sm leading-relaxed mb-6 font-medium">
                      {app.description}
                    </p>
                  </div>

                  {/* Przycisk uruchomienia */}
                  <div className="pt-4 border-t border-slate-800/85 flex items-center justify-between">
                    <span className="text-[11px] text-emerald-400 font-semibold flex items-center gap-1.5 bg-emerald-950/60 px-2.5 py-1 rounded-lg border border-emerald-900/60">
                      <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                      Aktywna
                    </span>

                    <a 
                      href={app.url} 
                      target="_blank" 
                      rel="noopener noreferrer"
                      className={`inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-gradient-to-r ${app.gradient} text-white font-bold text-xs sm:text-sm shadow-lg hover:scale-105 active:scale-95 transition-all`}
                    >
                      <span>Uruchom</span>
                      <i data-lucide="external-link" className="w-4 h-4"></i>
                    </a>
                  </div>
                </div>
              ))}
            </div>

            {/* Mniejszy 3. kafelek dla Stopniowania */}
            {APPS_CONFIG.filter(app => app.isCompact).map((app) => (
              <div 
                key={app.id}
                className={`w-full bg-slate-900/90 border ${app.borderColor} rounded-2xl ${isMobileView ? 'p-3' : 'p-4 sm:p-5'} shadow-xl flex flex-col sm:flex-row items-center justify-between gap-3 transition-all duration-300 hover:bg-slate-900`}
              >
                <div className="flex items-center gap-3 w-full sm:w-auto">
                  <div className={`w-11 h-11 shrink-0 rounded-xl bg-gradient-to-br ${app.gradient} p-0.5 shadow-md flex items-center justify-center`}>
                    <div className="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center overflow-hidden">
                      {app.logoSvg}
                    </div>
                  </div>
                  <div className="flex-1">
                    <div className="flex items-center gap-2 flex-wrap">
                      <h3 className="font-extrabold text-white text-sm sm:text-base tracking-tight">
                        {app.title}
                      </h3>
                      <span className="px-1.5 py-0.5 rounded bg-purple-950 text-purple-300 border border-purple-800 text-[9px] font-bold">
                        {app.badgeTag}
                      </span>
                      <span className={`px-1.5 py-0.5 rounded border text-[9px] font-bold ${app.badgeBg}`}>
                        v{appVersions[app.id]}
                      </span>
                    </div>
                    <p className="text-slate-400 text-xs font-medium mt-0.5 line-clamp-1">
                      {app.description}
                    </p>
                  </div>
                </div>

                <div className="flex items-center gap-3 w-full sm:w-auto justify-end border-t sm:border-t-0 border-slate-800/80 pt-2 sm:pt-0">
                  <span className="text-[10px] text-emerald-400 font-semibold flex items-center gap-1 bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-900/60">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    Nowość
                  </span>
                  <a 
                    href={app.url} 
                    target="_blank" 
                    rel="noopener noreferrer"
                    className={`inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-gradient-to-r ${app.gradient} text-white font-bold text-xs shadow-md hover:scale-105 active:scale-95 transition-all`}
                  >
                    <span>Otwórz</span>
                    <i data-lucide="external-link" className="w-3.5 h-3.5"></i>
                  </a>
                </div>
              </div>
            ))}
          </main>

          {/* Footer */}
          <footer className={`w-full ${isMobileView ? 'max-w-sm' : 'max-w-4xl'} text-center py-3 text-[10px] text-slate-500 font-medium mt-6 transition-all border-t border-slate-900`}>
            <div>Językowy Master Hub &bull; Wszystkie prawa zastrzeżone</div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
