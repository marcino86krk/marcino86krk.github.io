<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SPANISH_CHARS = ['á', 'é', 'í', 'ó', 'ú', 'ñ', 'ü', '¿', '¡'];
    const DATABASE_URL = 'https://marcino86krk.github.io/baza_esp.ods';

    const INITIAL_WORDS = [
      { id: '1', es: 'ser', pl: 'być', isVerb: true, isManual: false },
      { id: '2', es: 'estar', pl: 'być / znajdować się', isVerb: true, isManual: false },
      { id: '3', es: 'hablar', pl: 'mówić', isVerb: true, isManual: false },
      { id: '4', es: 'hola', pl: 'cześć', isVerb: false, isManual: false },
      { id: '5', es: 'gracias', pl: 'dziękuję', isVerb: false, isManual: false }
    ];

    function SpanishCharBar({ onInsertChar, className = "" }) {
      return (
        <div className={`flex flex-wrap gap-1 items-center justify-center bg-slate-900 p-1.5 rounded-xl border border-slate-800 ${className}`}>

            <button
              key={char}
              type="button"
              onMouseDown={(e) => {
                e.preventDefault();
                onInsertChar(char);
              }}
              className="w-7 h-7 sm:w-8 sm:h-8 flex items-center justify-center bg-slate-800 hover:bg-red-600 hover:text-white text-slate-200 font-bold text-sm rounded-lg border border-slate-700 active:scale-95 transition"
            >
              {char}
            </button>
          ))}
        </div>
      );
    }

    function Logo() {
      return (
        <div className="flex items-center gap-3">
          <div className="w-12 h-12 rounded-xl bg-gradient-to-br from-red-600 via-amber-500 to-yellow-400 p-0.5 shadow-lg flex items-center justify-center">
            <div className="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center relative overflow-hidden">
              <svg viewBox="0 0 100 100" className="w-9 h-9">
                <path d="M 15,30 Q 35,22 50,35 Q 65,22 85,30 L 85,75 Q 65,67 50,80 Q 35,67 15,75 Z" fill="#1e293b" stroke="#f59e0b" strokeWidth="3"/>
                <path d="M 50,35 L 50,80" stroke="#f59e0b" strokeWidth="3"/>
                <line x1="23" y1="42" x2="41" y2="47" stroke="#94a3b8" strokeWidth="3" strokeLinecap="round"/>
                <line x1="23" y1="52" x2="38" y2="57" stroke="#94a3b8" strokeWidth="3" strokeLinecap="round"/>
                <line x1="59" y1="42" x2="77" y2="47" stroke="#ef4444" strokeWidth="3" strokeLinecap="round"/>
                <line x1="59" y1="52" x2="74" y2="57" stroke="#94a3b8" strokeWidth="3" strokeLinecap="round"/>
                <text x="50" y="30" fontFamily="system-ui" fontWeight="900" fontSize="24" fill="#ef4444" textAnchor="middle">Ñ</text>
              </svg>
            </div>
          </div>
          <div>
            <h1 className="text-lg font-black tracking-tight text-white flex items-center gap-1">
              HISZPAŃSKI <span className="text-red-500">MASTER 1.6</span>
            </h1>
            <p className="text-[11px] text-slate-400 font-medium">Seria: Językowy Master</p>
          </div>
        </div>
      );
    }

    function App() {
      const [words, setWords] = useState(() => {
        const saved = localStorage.getItem('hm_words');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.length > 0) return parsed;
          } catch(e) {}
        }
        return INITIAL_WORDS;
      });

      const [conjugationTable, setConjugationTable] = useState(() => {
        const saved = localStorage.getItem('hm_conjugations');
        if (saved) {
          try { return JSON.parse(saved); } catch(e) {}
        }
        return {};
      });

      const [loading, setLoading] = useState(false);
      const [loadMessage, setLoadMessage] = useState(null);
      const [activeTab, setActiveTab] = useState('flashcards');
      const [searchTerm, setSearchTerm] = useState('');
      const [direction, setDirection] = useState('random');
      const [quizDirection, setQuizDirection] = useState('random');
      const [activeVerbField, setActiveVerbField] = useState('yo');

      const [newEs, setNewEs] = useState('');
      const [newPl, setNewPl] = useState('');
      const [newIsVerb, setNewIsVerb] = useState(false);
      const [newManualConjs, setNewManualConjs] = useState({
        presente: { yo: '', tu: '', el: '', nosotros: '', vosotros: '', ellos: '' },
        pasado: { yo: '', tu: '', el: '', nosotros: '', vosotros: '', ellos: '' },
        imperfecto: { yo: '', tu: '', el: '', nosotros: '', vosotros: '', ellos: '' },
        futuro: { yo: '', tu: '', el: '', nosotros: '', vosotros: '', ellos: '' }
      });
      const [activeManualTense, setActiveManualTense] = useState('presente');

      const [eraseModalOpen, setEraseModalOpen] = useState(false);
      const [erasePassword, setErasePassword] = useState('');
      const [eraseError, setEraseError] = useState(false);

      const [shuffledCards, setShuffledCards] = useState([]);
      const [fcIndex, setFcIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [fcIsEsToPl, setFcIsEsToPl] = useState(true);

      const [shuffledQuiz, setShuffledQuiz] = useState([]);
      const [qIndex, setQIndex] = useState(0);
      const [userAnswer, setUserAnswer] = useState('');
      const [quizResult, setQuizResult] = useState(null);
      const [score, setScore] = useState(0);
      const [quizIsEsToPl, setQuizIsEsToPl] = useState(true);

      const [verbIndex, setVerbIndex] = useState(0);
      const [selectedTense, setSelectedTense] = useState('presente');
      const [verbAnswers, setVerbAnswers] = useState({ yo: '', tu: '', el: '', nosotros: '', vosotros: '', ellos: '' });
      const [verbSubmitted, setVerbSubmitted] = useState(false);

      const inputRefs = useRef({});
      const fileInputRef = useRef(null);
      const audioCtxRef = useRef(null);

      const playSound = (type) => {
        try {
          if (!audioCtxRef.current) {
            audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
          }
          const ctx = audioCtxRef.current;
          if (ctx.state === 'suspended') ctx.resume();

          const now = ctx.currentTime;
          if (type === 'correct') {
            const osc1 = ctx.createOscillator();
            const osc2 = ctx.createOscillator();
            const gain = ctx.createGain();

            osc1.type = 'sine';
            osc2.type = 'triangle';
            osc1.frequency.setValueAtTime(523.25, now);
            osc1.frequency.setValueAtTime(659.25, now + 0.1);
            osc1.frequency.setValueAtTime(783.99, now + 0.2);

            osc2.frequency.setValueAtTime(261.63, now);
            osc2.frequency.setValueAtTime(329.63, now + 0.1);
            osc2.frequency.setValueAtTime(392.00, now + 0.2);

            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

            osc1.connect(gain);
            osc2.connect(gain);
            gain.connect(ctx.destination);

            osc1.start(now);
            osc2.start(now);
            osc1.stop(now + 0.5);
            osc2.stop(now + 0.5);
          } else if (type === 'incorrect') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.setValueAtTime(130, now + 0.15);

            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(now);
            osc.stop(now + 0.4);
          }
        } catch (e) {}
      };

      const normalizeText = (text) => {
        return (text || '')
          .toLowerCase()
          .trim()
          .normalize("NFD")
          .replace(/[̀-ͯ]/g, "");
      };

      useEffect(() => {
        localStorage.setItem('hm_words', JSON.stringify(words));
      }, [words]);

      useEffect(() => {
        localStorage.setItem('hm_conjugations', JSON.stringify(conjugationTable));
      }, [conjugationTable]);

      const parseWorkbookData = (workbook) => {
        let bazaSheetName = workbook.SheetNames.find(name => normalizeText(name).includes('baza') || normalizeText(name) === 'words') || workbook.SheetNames[0];
        const wsBaza = workbook.Sheets[bazaSheetName];
        const rowsBaza = XLSX.utils.sheet_to_json(wsBaza, { header: 1 });

        const wordMap = new Map();
        rowsBaza.forEach(row => {
          if (row && row[0] && row[1]) {
            const es = String(row[0]).trim();
            const pl = String(row[1]).trim();
            const colC = row[2] ? String(row[2]).trim().toUpperCase() : '';

            const isVerb = (colC === 'TAK' || colC === 'YES' || colC === 'TRUE' || colC === '1');
            const key = normalizeText(es);

            if (wordMap.has(key)) {
              const item = wordMap.get(key);
              const existingVars = item.pl.split(/[\/,;]/).map(v => normalizeText(v));
              if (!existingVars.includes(normalizeText(pl))) {
                item.pl = `${item.pl} / ${pl}`;
              }
              if (isVerb) item.isVerb = true;
            } else {
              wordMap.set(key, { es, pl, isVerb, isManual: false });
            }
          }
        });

        const newWords = [];
        let idCounter = Date.now();
        wordMap.forEach((val) => {
          newWords.push({ id: (idCounter++).toString(), ...val });
        });

        let odmianaSheetName = workbook.SheetNames.find(name => normalizeText(name).includes('odmiana') || normalizeText(name).includes('conjugation'));
        const newConjugations = {};

        if (odmianaSheetName) {
          const wsOdmiana = workbook.Sheets[odmianaSheetName];
          const rowsOdmiana = XLSX.utils.sheet_to_json(wsOdmiana, { header: 1 });
          
          rowsOdmiana.forEach(row => {
            if (row && row.length >= 8) {
              const verb = normalizeText(row[0]);
              const tense = normalizeText(row[1]);
              if (verb && tense) {
                if (!newConjugations[verb]) newConjugations[verb] = {};
                newConjugations[verb][tense] = {
                  yo: String(row[2] || '').trim(),
                  tu: String(row[3] || '').trim(),
                  el: String(row[4] || '').trim(),
                  nosotros: String(row[5] || '').trim(),
                  vosotros: String(row[6] || '').trim(),
                  ellos: String(row[7] || '').trim()
                };
              }
            }
          });
        }

        return { words: newWords, conjugations: newConjugations };
      };

      useEffect(() => {
        const autoUpdateDatabase = async () => {
          const urlsToTry = [
            DATABASE_URL,
            'https://api.allorigins.win/raw?url=' + encodeURIComponent(DATABASE_URL)
          ];

          let blob = null;
          for (const url of urlsToTry) {
            try {
              const response = await fetch(url);
              if (!response.ok) continue;
              blob = await response.blob();
              break;
            } catch (e) {}
          }

          if (!blob) return;

          try {
            const arrayBuffer = await blob.arrayBuffer();
            const workbook = XLSX.read(arrayBuffer, { type: 'array' });
            const { words: newWords, conjugations: newConjugations } = parseWorkbookData(workbook);

            if (newWords.length > 0) {
              setWords(prev => {
                const existingManual = prev.filter(w => w.isManual);
                return [...existingManual, ...newWords];
              });
            }
            if (Object.keys(newConjugations).length > 0) {
              setConjugationTable(prev => ({ ...prev, ...newConjugations }));
            }
          } catch (err) {}
        };

        autoUpdateDatabase();
      }, []);

      const handleDownloadAndSaveDatabase = async () => {
        setLoading(true);
        setLoadMessage("Pobieranie pliku bazy z serwera...");

        const urlsToTry = [
          DATABASE_URL,
          'https://api.allorigins.win/raw?url=' + encodeURIComponent(DATABASE_URL)
        ];

        let blob = null;
        for (const url of urlsToTry) {
          try {
            const response = await fetch(url);
            if (!response.ok) continue;
            blob = await response.blob();
            break;
          } catch (e) {}
        }

        if (!blob) {
          setLoading(false);
          setLoadMessage("Nie udało się pobrać pliku z serwera.");
          setTimeout(() => setLoadMessage(null), 5000);
          return;
        }

        const downloadUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = 'baza_esp.ods';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(downloadUrl);

        try {
          const arrayBuffer = await blob.arrayBuffer();
          const workbook = XLSX.read(arrayBuffer, { type: 'array' });
          const { words: newWords, conjugations: newConjugations } = parseWorkbookData(workbook);

          if (newWords.length > 0) {
            const existingManual = words.filter(w => w.isManual);
            setWords([...existingManual, ...newWords]);
            setLoadMessage(`Zamontowano pomyślnie ${newWords.length} słówek.`);
          }
          if (Object.keys(newConjugations).length > 0) {
            setConjugationTable(prev => ({ ...prev, ...newConjugations }));
          }
        } catch (err) {}

        setLoading(false);
        setTimeout(() => setLoadMessage(null), 5000);
      };

      const handleLoadLocalDatabase = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const { words: newWords, conjugations: newConjugations } = parseWorkbookData(workbook);

            if (newWords.length > 0) {
              const existingManual = words.filter(w => w.isManual);
              setWords([...existingManual, ...newWords]);
              setLoadMessage(`Zamontowano pomyślnie ${newWords.length} słówek z dysku lokalnego!`);
            }
            if (Object.keys(newConjugations).length > 0) {
              setConjugationTable(prev => ({ ...prev, ...newConjugations }));
            }
          } catch (err) {}
          setTimeout(() => setLoadMessage(null), 4000);
        };
        reader.readAsArrayBuffer(file);
      };

      // Zapis wyłącznie słówek wpisanych ręcznie pod nazwą baza_esp_ręcznie.ods (zgodnie z wzorcem baza + odmiana)
      const handleSaveManualWordsToDisk = () => {
        const manualWords = words.filter(w => w.isManual);
        if (manualWords.length === 0) {
          setLoadMessage("Brak ręcznie wpisanych słówek do zapisu.");
          setTimeout(() => setLoadMessage(null), 4000);
          return;
        }

        const sheetDataBaza = [
          ["Hiszpański", "Polski", "Czy czasownik (TAK/NIE)"],
          ...manualWords.map(w => [w.es, w.pl, w.isVerb ? "TAK" : "NIE"])
        ];
        const wsBaza = XLSX.utils.aoa_to_sheet(sheetDataBaza);

        const sheetDataOdmiana = [
          ["Czasownik", "Czas", "Yo", "Tu", "El", "Nosotros", "Vosotros", "Ellos"]
        ];
        manualWords.filter(w => w.isVerb).forEach(w => {
          const vKey = normalizeText(w.es);
          const tenses = conjugationTable[vKey];
          if (tenses) {
            Object.keys(tenses).forEach(t => {
              const conj = tenses[t];
              sheetDataOdmiana.push([w.es, t, conj.yo, conj.tu, conj.el, conj.nosotros, conj.vosotros, conj.ellos]);
            });
          }
        });
        const wsOdmiana = XLSX.utils.aoa_to_sheet(sheetDataOdmiana);

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, wsBaza, "baza");
        XLSX.utils.book_append_sheet(wb, wsOdmiana, "odmiana");
        XLSX.writeFile(wb, "baza_esp_ręcznie.ods");
        setLoadMessage("Pomyślnie zapisano wpisane słówka i odmiany do pliku baza_esp_ręcznie.ods!");
        setTimeout(() => setLoadMessage(null), 4000);
      };

      const handleEraseDatabase = (e) => {
        e.preventDefault();
        if (erasePassword.trim().toLowerCase() === 'erase') {
          setWords([]);
          setConjugationTable({});
          localStorage.removeItem('hm_words');
          localStorage.removeItem('hm_conjugations');
          setErasePassword('');
          setEraseError(false);
          setEraseModalOpen(false);
          setLoadMessage("Baza została wyczyszczona.");
          setTimeout(() => setLoadMessage(null), 3000);
        } else {
          setEraseError(true);
        }
      };

      const handleAddWord = (e) => {
        e.preventDefault();
        if (!newEs.trim() || !newPl.trim()) return;
        const newItem = {
          id: Date.now().toString(),
          es: newEs.trim(),
          pl: newPl.trim(),
          isVerb: newIsVerb,
          isManual: true
        };

        if (newIsVerb) {
          const vKey = normalizeText(newEs);
          setConjugationTable(prev => ({
            ...prev,
            [vKey]: { ...newManualConjs }
          }));
        }

        setWords([newItem, ...words]);
        setNewEs('');
        setNewPl('');
        setNewIsVerb(false);
        setNewManualConjs({
          presente: { yo: '', tu: '', el: '', nosotros: '', vosotros: '', ellos: '' },
          pasado: { yo: '', tu: '', el: '', nosotros: '', vosotros: '', ellos: '' },
          imperfecto: { yo: '', tu: '', el: '', nosotros: '', vosotros: '', ellos: '' },
          futuro: { yo: '', tu: '', el: '', nosotros: '', vosotros: '', ellos: '' }
        });
        setLoadMessage(`Dodano nowe słówko: "${newItem.es}".`);
        setTimeout(() => setLoadMessage(null), 3000);
      };

      const shuffleArray = (arr) => {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      };

      useEffect(() => {
        if (words.length > 0) {
          setShuffledCards(shuffleArray(words));
          setShuffledQuiz(shuffleArray(words));
        }
      }, [words]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      useEffect(() => {
        if (direction === 'es-pl') setFcIsEsToPl(true);
        else if (direction === 'pl-es') setFcIsEsToPl(false);
        else setFcIsEsToPl(Math.random() < 0.5);
      }, [fcIndex, direction]);

      useEffect(() => {
        if (quizDirection === 'es-pl') setQuizIsEsToPl(true);
        else if (quizDirection === 'pl-es') setQuizIsEsToPl(false);
        else setQuizIsEsToPl(Math.random() < 0.5);
      }, [qIndex, quizDirection]);

      const speakText = (text, lang = 'es-ES') => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        window.speechSynthesis.speak(utterance);
      };

      const insertCharToRef = (refKey, char, setter, currentValue) => {
        const el = inputRefs.current[refKey];
        if (el && typeof el.selectionStart === 'number') {
          const start = el.selectionStart;
          const end = el.selectionEnd;
          const updated = currentValue.slice(0, start) + char + currentValue.slice(end);
          setter(updated);
          setTimeout(() => {
            el.focus();
            el.setSelectionRange(start + 1, start + 1);
          }, 0);
        } else {
          setter(currentValue + char);
        }
      };

      const generateConjugation = (verbObj, tense) => {
        if (!verbObj) return null;
        const vKey = normalizeText(verbObj.es);
        const tKey = normalizeText(tense);

        if (conjugationTable[vKey] && conjugationTable[vKey][tKey]) {
          return conjugationTable[vKey][tKey];
        }

        for (const key of Object.keys(conjugationTable)) {
          if (vKey.includes(key) || key.includes(vKey)) {
            if (conjugationTable[key][tKey]) return conjugationTable[key][tKey];
          }
        }

        let stem = verbObj.es.slice(0, -2);
        let ending = verbObj.es.slice(-2).toLowerCase();

        if (ending === 'ar') {
          if (tKey === 'presente') return { yo: stem + 'o', tu: stem + 'as', el: stem + 'a', nosotros: stem + 'amos', vosotros: stem + 'áis', ellos: stem + 'an' };
          if (tKey === 'pasado' || tKey === 'indefinido') return { yo: stem + 'é', tu: stem + 'aste', el: stem + 'ó', nosotros: stem + 'amos', vosotros: stem + 'asteis', ellos: stem + 'aron' };
          if (tKey === 'imperfecto') return { yo: stem + 'aba', tu: stem + 'abas', el: stem + 'aba', nosotros: stem + 'ábamos', vosotros: stem + 'abais', ellos: stem + 'aban' };
          if (tKey === 'futuro') return { yo: verbObj.es + 'é', tu: verbObj.es + 'ás', el: verbObj.es + 'á', nosotros: stem + 'emos', vosotros: stem + 'éis', ellos: stem + 'án' };
        } else if (ending === 'er' || ending === 'ir') {
          if (tKey === 'presente') return { yo: stem + 'o', tu: stem + 'es', el: stem + 'e', nosotros: stem + 'emos', vosotros: stem + 'éis', ellos: stem + 'en' };
          if (tKey === 'pasado' || tKey === 'indefinido') return { yo: stem + 'í', tu: stem + 'iste', el: stem + 'ió', nosotros: stem + 'imos', vosotros: stem + 'isteis', ellos: stem + 'ieron' };
          if (tKey === 'imperfecto') return { yo: stem + 'ía', tu: stem + 'ías', el: stem + 'ía', nosotros: stem + 'íamos', vosotros: stem + 'íais', ellos: stem + 'ían' };
          if (tKey === 'futuro') return { yo: verbObj.es + 'é', tu: verbObj.es + 'ás', el: verbObj.es + 'á', nosotros: stem + 'emos', vosotros: stem + 'éis', ellos: stem + 'án' };
        }

        return { yo: stem + 'o', tu: stem + 'as', el: stem + 'a', nosotros: stem + 'amos', vosotros: stem + 'áis', ellos: stem + 'an' };
      };

      const verbList = words.filter(w => w.isVerb);
      const currentVerb = verbList.length > 0 ? verbList[verbIndex % verbList.length] : null;
      const currentVerbData = currentVerb ? generateConjugation(currentVerb, selectedTense) : null;

      const filteredWords = words.filter(w => 
        w.es.toLowerCase().includes(searchTerm.toLowerCase()) || 
        w.pl.toLowerCase().includes(searchTerm.toLowerCase())
      );

      const currentCard = shuffledCards.length > 0 ? shuffledCards[fcIndex % shuffledCards.length] : null;
      const quizItem = shuffledQuiz.length > 0 ? shuffledQuiz[qIndex % shuffledQuiz.length] : null;

      const fcData = currentCard ? {
        question: fcIsEsToPl ? currentCard.es : currentCard.pl,
        answer: fcIsEsToPl ? currentCard.pl : currentCard.es
      } : null;

      const quizData = quizItem ? {
        question: quizIsEsToPl ? quizItem.es : quizItem.pl,
        answer: quizIsEsToPl ? quizItem.pl : quizItem.es
      } : null;

      const handleCheckQuiz = (e) => {
        e.preventDefault();
        if (!quizData || quizResult !== null) return;
        const isCorrect = normalizeText(userAnswer) === normalizeText(quizData.answer);
        if (isCorrect) {
          playSound('correct');
          setQuizResult('correct');
          setScore(prev => prev + 1);
        } else {
          playSound('incorrect');
          setQuizResult('incorrect');
        }
      };

      const handleCheckVerbs = () => {
        if (!currentVerbData) return;
        let allCorrect = true;
        ['yo', 'tu', 'el', 'nosotros', 'vosotros', 'ellos'].forEach(p => {
          if (normalizeText(verbAnswers[p]) !== normalizeText(currentVerbData[p])) {
            allCorrect = false;
          }
        });
        if (allCorrect) playSound('correct');
        else playSound('incorrect');
        setVerbSubmitted(true);
      };

      const handleNextQuiz = () => {
        setUserAnswer('');
        setQuizResult(null);
        setQIndex(prev => prev + 1);
      };

      const handleNextVerb = () => {
        setVerbSubmitted(false);
        setVerbAnswers({ yo: '', tu: '', el: '', nosotros: '', vosotros: '', ellos: '' });
        setVerbIndex(prev => prev + 1);

      return (
        <div className="min-h-[100dvh] w-full bg-slate-950 flex flex-col items-center justify-between p-2 sm:p-4 text-slate-100">

            <Logo />
            <div className="text-xs text-slate-400">Baza: baza_esp.ods (baza + odmiana)</div>
          </header>

          {eraseModalOpen && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-md w-full space-y-4 shadow-2xl">
                <h3 className="text-lg font-bold text-white flex items-center gap-2">
                  <i data-lucide="alert-triangle" className="w-5 h-5 text-red-500"></i>
                  <span>Usuwanie bazy danych</span>
                </h3>
                <p className="text-xs text-slate-300">Wpisz hasło <code className="text-red-400 font-bold">erase</code>:</p>
                <form onSubmit={handleEraseDatabase} className="space-y-3">
                  <input
                    type="password"
                    placeholder="Hasło..."
                    value={erasePassword}
                    onChange={(e) => setErasePassword(e.target.value)}
                    className="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-white text-sm"
                  />
                  {eraseError && <p className="text-xs text-red-400 font-semibold">Błędne hasło!</p>}
                  <div className="flex gap-2 justify-end">
                    <button type="button" onClick={() => setEraseModalOpen(false)} className="px-4 py-2 bg-slate-800 text-xs rounded-xl">Anuluj</button>
                    <button type="submit" className="px-4 py-2 bg-red-600 text-xs rounded-xl">Usuń</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <div className="w-full max-w-5xl flex-1 flex flex-col">
            <div className="bg-slate-900 p-3 sm:p-5 rounded-2xl shadow-xl border border-slate-800 flex-1 w-full flex flex-col mb-2">
              
              <nav className="grid grid-cols-5 gap-1.5 sm:gap-2 mb-6 bg-slate-950 p-1.5 rounded-xl text-[11px] sm:text-sm font-medium border border-slate-800/80">
                <button onClick={() => setActiveTab('flashcards')} className={`py-2 rounded-lg flex flex-col sm:flex-row items-center justify-center gap-1 ${activeTab === 'flashcards' ? 'bg-slate-800 text-red-400 font-bold border border-slate-700' : 'text-slate-400'}`}>

                <button onClick={() => setActiveTab('verbs')} className={`py-2 rounded-lg flex flex-col sm:flex-row items-center justify-center gap-1 ${activeTab === 'verbs' ? 'bg-slate-800 text-red-400 font-bold border border-slate-700' : 'text-slate-400'}`}>

                      <button onClick={() => setQuizDirection('pl-es')} className={`px-2.5 py-1 rounded-lg ${quizDirection === 'pl-es' ? 'bg-slate-800 text-red-400' : 'text-slate-400'}`}>PL ➔ ES</button>
                      <button onClick={() => setQuizDirection('random')} className={`px-2.5 py-1 rounded-lg ${quizDirection === 'random' ? 'bg-slate-800 text-red-400' : 'text-slate-400'}`}>Losowo</button>
                    </div>
                    <div className="text-xs font-bold text-slate-300 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800">Wynik: <span className="text-red-400">{score}</span></div>
                  </div>

                  {shuffledQuiz.length > 0 && quizData ? (
                    <div className="w-full max-w-md my-auto space-y-4">
                      <div className="bg-slate-950/80 p-6 rounded-2xl border border-slate-800 text-center space-y-2">
                        <div className="text-xs text-slate-400 uppercase font-bold">{quizIsEsToPl ? 'Przetłumacz na polski:' : 'Przetłumacz na hiszpański:'}</div>
                        <h2 className="text-2xl font-bold text-slate-100">{quizData.question}</h2>
                      </div>
                      <form onSubmit={handleCheckQuiz} className="space-y-4">
                        <input
                          ref={el => inputRefs.current['userAnswer'] = el}
                          type="text"
                          placeholder="Wpisz tłumaczenie..."
                          value={userAnswer}
                          disabled={quizResult !== null}
                          onChange={(e) => setUserAnswer(e.target.value)}
                          className="w-full px-4 py-3 bg-slate-800 border border-slate-700 text-white rounded-xl text-center text-lg font-medium"
                        />
                        {quizResult === null && <SpanishCharBar onInsertChar={(c) => insertCharToRef('userAnswer', c, setUserAnswer, userAnswer)} />}
                        {quizResult === null ? (
                          <button type="submit" className="w-full py-3 bg-red-600 text-white font-semibold rounded-xl">Sprawdź</button>
                        ) : (
                          <div className="space-y-3">
                            <div className={`p-4 rounded-xl text-center text-sm font-semibold ${quizResult === 'correct' ? 'bg-emerald-950 text-emerald-300' : 'bg-red-950 text-red-300'}`}>
                              {quizResult === 'correct' ? 'Dobrze!' : `Błędnie. Odpowiedź: ${quizData.answer}`}
                            </div>
                            <button type="button" onClick={handleNextQuiz} className="w-full py-3 bg-slate-800 text-white font-semibold rounded-xl">Następne ➔</button>
                          </div>
                        )}
                      </form>
                    </div>
                  ) : <div className="text-slate-500 text-sm my-auto">Brak słówek w quizie.</div>}
                </div>
              )}

              {/* 3. CZASOWNIKI */}
              {activeTab === 'verbs' && (
                <div className="flex-1 flex flex-col space-y-6">
                  {currentVerb && currentVerbData ? (
                    <div className="flex-1 flex flex-col justify-between max-w-xl mx-auto w-full space-y-4">
                      <div className="text-center space-y-2">
                        <h3 className="text-lg font-bold text-slate-100 capitalize">
                          Czasownik: <span className="text-red-400">{currentVerb.es}</span> ({currentVerb.pl})
                        </h3>
                        <div className="flex flex-wrap justify-center gap-1.5">
                          {['presente', 'pasado', 'imperfecto', 'futuro'].map(t => (
                            <button key={t} onClick={() => setSelectedTense(t)} className={`px-3 py-1 text-xs rounded-lg uppercase font-semibold ${selectedTense === t ? 'bg-red-600 text-white' : 'bg-slate-800 text-slate-400'}`}>
                              {t}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        {['yo', 'tu', 'el', 'nosotros', 'vosotros', 'ellos'].map((p) => {
                          const isFieldCorrect = verbSubmitted && normalizeText(verbAnswers[p]) === normalizeText(currentVerbData[p]);
                          return (
                            <div key={p} className={`bg-slate-950 p-3 rounded-xl border ${verbSubmitted ? (isFieldCorrect ? 'border-emerald-700' : 'border-red-800') : 'border-slate-800'}`}>
                              <label className="text-xs font-bold text-slate-300 block mb-1 uppercase">{p}</label>
                              <input
                                ref={el => inputRefs.current[`verb_${p}`] = el}
                                type="text"
                                value={verbAnswers[p]}
                                disabled={verbSubmitted}
                                onFocus={() => setActiveVerbField(p)}
                                onChange={(e) => setVerbAnswers({ ...verbAnswers, [p]: e.target.value })}
                                placeholder={verbSubmitted ? currentVerbData[p] : '...'}
                                className="w-full px-3 py-1.5 text-sm rounded-lg border border-slate-700 bg-slate-800 text-white"
                              />
                            </div>
                          );
                        })}
                      </div>

                      {!verbSubmitted && (
                        <SpanishCharBar onInsertChar={(c) => insertCharToRef(`verb_${activeVerbField}`, c, (val) => setVerbAnswers({...verbAnswers, [activeVerbField]: val}), verbAnswers[activeVerbField])} />
                      )}

                      <div className="flex gap-3">
                        {!verbSubmitted ? (
                          <button onClick={handleCheckVerbs} className="flex-1 py-2.5 bg-red-600 text-white font-semibold rounded-xl">Sprawdź</button>
                        ) : (
                          <button onClick={handleNextVerb} className="flex-1 py-2.5 bg-slate-800 text-white font-semibold rounded-xl">Następny ➔</button>
                        )}
                      </div>
                    </div>
                  ) : <div className="text-center text-slate-500 text-sm my-auto">Brak czasowników w bazie.</div>}
                </div>
              )}

              {/* 4. SŁOWNIK */}
              {activeTab === 'dict' && (
                <div className="space-y-4 flex-1 flex flex-col">
                  <input
                    type="text"
                    placeholder="Szukaj w słowniku..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="w-full px-4 py-2 bg-slate-950 border border-slate-800 text-white rounded-xl text-sm"
                  />
                  <div className="flex-1 overflow-y-auto max-h-[420px] border border-slate-800 rounded-xl bg-slate-950/40">
                    <table className="w-full text-left text-sm">
                      <thead className="bg-slate-950 border-b border-slate-800 sticky top-0 text-xs font-semibold text-slate-400 uppercase">
                        <tr>
                          <th className="p-3">Hiszpański</th>

                      </tbody>

              {activeTab === 'admin' && (
                <div className="space-y-6 flex-1 flex flex-col max-w-xl mx-auto w-full">
                  <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3">
                    <h3 className="text-sm font-bold text-white">Pobierz i zamontuj bazę z serwera</h3>
                    <button onClick={handleDownloadAndSaveDatabase} disabled={loading} className="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold shadow">

                          {['yo', 'tu', 'el', 'nosotros', 'vosotros', 'ellos'].map(p => (
                            <div key={p}>
                              <label className="text-[10px] text-slate-400 uppercase block mb-0.5">{p}</label>
                              <input
                                type="text"
                                placeholder={`Forma dla ${p}`}
                                value={newManualConjs[activeManualTense][p]}
                                onChange={(e) => {
                                  const val = e.target.value;
                                  setNewManualConjs(prev => ({
                                    ...prev,
                                    [activeManualTense]: {
                                      ...prev[activeManualTense],
                                      [p]: val
                                    }
                                  }));
                                }}
                                className="w-full px-2 py-1 text-xs bg-slate-950 border border-slate-700 rounded text-white"
                              />
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    <div className="flex justify-end pt-2">
                      <button type="submit" className="px-4 py-2 bg-red-600 text-white text-xs font-semibold rounded-lg">Dodaj</button>
                    </div>
                  </form>

                  <div className="bg-slate-950 p-4 rounded-xl border border-red-950 space-y-3">
                    <h3 className="text-sm font-bold text-red-400">Usuń całą bazę</h3>
                    <button onClick={() => setEraseModalOpen(true)} className="px-4 py-2 bg-red-900 text-white rounded-xl text-xs font-semibold">Usuń bazę</button>
                  </div>
                </div>
              )}

            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });`;
        const blob = new Blob([swCode], { type: 'text/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
      });
    }
  </script>
</body>
</html>
