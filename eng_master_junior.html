            if (!isNaN(modDate)) {

            } else {
              setFileLastModified(document.lastModified);
            }
          }
        } catch(e) {
          setFileLastModified('Brak danych');
        }

        const loadVoices = () => {
          if ('speechSynthesis' in window) {
            voicesRef.current = window.speechSynthesis.getVoices();
          }
        };
        loadVoices();
        if ('speechSynthesis' in window) {
          window.speechSynthesis.onvoiceschanged = loadVoices;
        }
      }, []);

      const normalizeText = (text) => {
        return (text || '').toLowerCase().trim();
      };

      const getLevenshteinDistance = (a, b) => {
        if (a.length === 0) return b.length;
        if (b.length === 0) return a.length;
        const matrix = [];
        for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
        for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
        for (let i = 1; i <= b.length; i++) {
          for (let j = 1; j <= a.length; j++) {
            if (b.charAt(i - 1) === a.charAt(j - 1)) {
              matrix[i][j] = matrix[i - 1][j - 1];
            } else {
              matrix[i][j] = Math.min(
                matrix[i - 1][j - 1] + 1,
                Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1)
              );
            }
          }
        }
        return matrix[b.length][a.length];
      };

      const evaluateAnswer = (userText, allowedAnswersList) => {
        const userNorm = normalizeText(userText);
        if (!userNorm) return { status: 'incorrect', matched: '' };

        for (const ans of allowedAnswersList) {
          if (userNorm === ans) {
            return { status: 'correct', matched: ans };
          }
        }

        for (const ans of allowedAnswersList) {
          const maxAllowedDist = ans.length <= 5 ? 1 : 2;
          const dist = getLevenshteinDistance(userNorm, ans);
          if (dist <= maxAllowedDist) {
            return { status: 'typo', matched: ans };
          }
        }

        return { status: 'incorrect', matched: allowedAnswersList[0] || '' };
      };

      const shuffleArray = (arr) => {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      };

      const speakText = (text, forcedLang = null) => {
        if (!text) return;
        const cleanText = text.split(/[\/,;]/)[0].trim();
        let targetLang = forcedLang || 'en';

        try {
          const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(cleanText)}&tl=${targetLang}&client=tw-ob`;
          const audio = new Audio(ttsUrl);
          audio.play().catch(() => {
            fallbackSpeak(cleanText, targetLang === 'en' ? 'en-GB' : 'pl-PL');
          });
        } catch (e) {
          fallbackSpeak(cleanText, targetLang === 'en' ? 'en-GB' : 'pl-PL');
        }
      };

      const fallbackSpeak = (text, lang) => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 0.92;
        const voices = voicesRef.current.length > 0 ? voicesRef.current : window.speechSynthesis.getVoices();
        const matchingVoices = voices.filter(v => v.lang.toLowerCase().includes(lang.slice(0, 2).toLowerCase()));
        if (matchingVoices.length > 0) {
          utterance.voice = matchingVoices[0];
        }
        window.speechSynthesis.speak(utterance);
      };

      useEffect(() => {
        const filtered = words.filter(w => w.dept === fcDept);
        if (filtered.length > 0) {
          setShuffledCards(shuffleArray(filtered));
          setFcIndex(0);
          setIsFlipped(false);
        }

      useEffect(() => {
        const filtered = words.filter(w => w.dept === typeDept);
        if (filtered.length > 0) {
          setShuffledTypeItems(shuffleArray(filtered));
          setTypeIndex(0);
          setTypeScore(0);
          setUserAnswer('');

        if (typeDirection === 'en-pl') setTypeIsEnToPl(true);
        else if (typeDirection === 'pl-en') setTypeIsEnToPl(false);
        else setTypeIsEnToPl(Math.random() < 0.5);

        else if (direction === 'pl-es') setFcIsEsToPl(false);

        questionLang: fcIsEsToPl ? 'en' : 'pl',
        answerLang: fcIsEsToPl ? 'pl' : 'en',
        dept: currentCard.dept

      const currentTypeItem = shuffledTypeItems.length > 0 ? shuffledTypeItems[typeIndex % shuffledTypeItems.length] : null;
      const typeData = currentTypeItem ? {
        question: typeIsEnToPl ? currentTypeItem.es : currentTypeItem.pl,
        allowedAnswers: typeIsEnToPl 
          ? currentTypeItem.pl.split(/[\/,;]/).map(a => normalizeText(a))
          : currentTypeItem.es.split(/[\/,;]/).map(a => normalizeText(a)),
        displayAnswer: typeIsEnToPl ? currentTypeItem.pl : currentTypeItem.es,
        audioWord: currentTypeItem.es,
        dept: currentTypeItem.dept

      const handleCheckTypeAnswer = (e) => {
        e.preventDefault();
        if (typeResult !== null || !typeData) return;

              </button>
              <div className={`${isMobileView ? 'text-[10px]' : 'text-xs'} text-slate-400 text-right`}>
                <div>Baza: <span className="text-blue-400 font-bold">{words.length}</span> pozycji</div>

          </header>

          <div className={`w-full ${isMobileView ? 'max-w-sm' : 'max-w-5xl'} flex-1 flex flex-col transition-all`}>
            <div className={`bg-slate-900 ${isMobileView ? 'p-2.5' : 'p-3 sm:p-5'} rounded-2xl shadow-xl border border-slate-800 flex-1 w-full flex flex-col mb-2 transition-all`}>

                  {shuffledCards.length > 0 && fcData ? (

                        <div className="w-full flex justify-between items-center text-[11px] opacity-80">
                          <span className="bg-black/30 px-2.5 py-1 rounded-lg text-[10px] font-bold text-blue-300">{fcData.dept}</span>

                          <h2 className={`${isMobileView ? 'text-xl' : 'text-2xl'} font-extrabold`}>{isFlipped ? fcData.answer : fcData.question}</h2>
                          <p className="text-[11px] opacity-75">Kliknij, aby odwrócić</p>
                        </div>
                        <button onClick={(e) => { 
                          e.stopPropagation(); 
                          speakText(isFlipped ? fcData.answer : fcData.question, isFlipped ? fcData.answerLang : fcData.questionLang); 
                        }} className="p-2.5 bg-black/30 rounded-full text-white hover:bg-black/50 transition">
                          <i data-lucide="volume-2" className="w-4 h-4"></i>
                        </button>
                      </div>
                      <div className="flex items-center gap-3 mt-4">
                        <button onClick={() => { setIsFlipped(false); setFcIndex(prev => Math.max(0, prev - 1)); }} className="p-2.5 bg-slate-800 text-slate-200 rounded-xl"><i data-lucide="chevron-left" className="w-4 h-4"></i></button>
                        <button onClick={() => { setIsFlipped(false); setFcIndex(prev => prev + 1); }} className="px-5 py-2.5 bg-blue-600 text-white rounded-xl font-semibold text-xs sm:text-sm">Następna ➔</button>
                      </div>

                </div>
              )}

              {/* PISANIE */}
              {activeTab === 'typing' && (
                <div className="flex-1 flex flex-col items-center justify-between space-y-4">
                  <div className="w-full max-w-md space-y-1">
                    <label className="text-[10px] font-bold text-slate-400 uppercase tracking-wide block">Wybierz dział / zagadnienie pisania:</label>
                    <select
                      value={typeDept}
                      onChange={(e) => setTypeDept(e.target.value)}
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-800 text-white rounded-xl text-xs font-semibold focus:outline-none focus:border-blue-500 shadow-inner"
                    >
                      {departmentsList.map(dept => (
                        <option key={dept} value={dept}>{dept}</option>
                      ))}
                    </select>
                  </div>

                  <div className="w-full flex flex-wrap justify-between items-center gap-2">
                    <div className="flex items-center gap-1 bg-slate-950 p-1 rounded-xl text-xs font-medium border border-slate-800">
                      <button onClick={() => setTypeDirection('en-pl')} className={`px-2.5 py-1 rounded-lg ${typeDirection === 'en-pl' ? 'bg-slate-800 text-blue-400' : 'text-slate-400'}`}>EN ➔ PL</button>
                      <button onClick={() => setTypeDirection('pl-en')} className={`px-2.5 py-1 rounded-lg ${typeDirection === 'pl-en' ? 'bg-slate-800 text-blue-400' : 'text-slate-400'}`}>PL ➔ EN</button>
                      <button onClick={() => setTypeDirection('random')} className={`px-2.5 py-1 rounded-lg ${typeDirection === 'random' ? 'bg-slate-800 text-blue-400' : 'text-slate-400'}`}>Losowo</button>
                    </div>
                    <div className="text-xs font-bold text-slate-300 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800">
                      Punkty: <span className="text-blue-400">{typeScore}</span>
                    </div>
                  </div>

                  {shuffledTypeItems.length > 0 && typeData ? (
                    <div className="w-full max-w-md my-auto space-y-3">
                      <div className="bg-slate-950/80 p-4 rounded-2xl border border-slate-800 text-center space-y-2">
                        <div className="flex justify-between items-center text-[10px] text-slate-400 font-bold uppercase">
                          <span>{typeIsEnToPl ? 'Wpisz tłumaczenie po polsku:' : 'Wpisz tłumaczenie po angielsku:'}</span>
                          <span className="bg-slate-900 px-2.5 py-0.5 rounded-lg border border-slate-800 text-blue-300">{typeData.dept}</span>
                        </div>
                        <h2 className="text-xl sm:text-2xl font-bold text-slate-100 flex items-center justify-center gap-2">
                          <span>{typeData.question}</span>
                          {!typeIsEnToPl && (
                            <button onClick={() => speakText(currentTypeItem.es, 'en')} className="text-slate-400 hover:text-blue-400">
                              <i data-lucide="volume-2" className="w-4 h-4"></i>
                            </button>
                          )}
                        </h2>
                      </div>

                      <form onSubmit={handleCheckTypeAnswer} className="space-y-3">
                        <input
                          type="text"
                          placeholder="Wpisz tłumaczenie..."
                          value={userAnswer}
                          disabled={typeResult !== null}
                          onChange={(e) => setUserAnswer(e.target.value)}
                          className="w-full px-3 py-2.5 bg-slate-800 border border-slate-700 text-white rounded-xl text-center text-base font-medium focus:outline-none focus:border-blue-500"
                        />

                        {typeResult === null ? (
                          <button type="submit" className="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl text-sm transition">Sprawdź</button>
                        ) : (
                          <div className="space-y-2.5">
                            {typeResult === 'correct' && (
                              <div className="p-3 rounded-xl text-center text-xs font-semibold bg-emerald-950 text-emerald-300 border border-emerald-800">
                                Świetnie! Poprawnie.
                              </div>
                            )}
                            {typeResult === 'typo' && (
                              <div className="p-3 rounded-xl text-center text-xs font-semibold bg-amber-950/90 text-amber-300 border border-amber-700/60 space-y-0.5">
                                <div>Zaliczone z drobną literówką!</div>
                                <div className="text-[11px] text-slate-200">Poprawnie: <span className="font-bold">{typeData.displayAnswer}</span></div>

                            {typeResult === 'incorrect' && (

                                <div>Błędnie. Prawidłowa odpowiedź:</div>
                                <div className="font-bold text-white text-sm">{typeMatchedWord}</div>
                              </div>
                            )}
                            <button type="button" onClick={handleNextTypeItem} className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-xl text-sm transition">Następne słówko ➔</button>
                          </div>

                      </form>
                    </div>
                  ) : <div className="text-slate-500 text-sm my-auto text-center">Brak danych w wybranym dziale.</div>}
                </div>
              )}

              {/* TEORIA I GRAMATYKA KLASA 5 (Wzbogacona o pełne zasady stopniowania z załącznika) */}
              {activeTab === 'grammar' && (
                <div className="flex-1 overflow-y-auto max-h-[380px] pr-1 space-y-3 text-xs custom-scrollbar">
                  
                  <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800 space-y-2">
                    <h3 className="font-bold text-blue-400 text-sm">Stopniowanie Przymiotników (Spelling Rules & Grammar)</h3>
                    <div className="space-y-2 text-slate-300">
                      <p>W stopniu wyższym (Comparative) porównujemy dwa obiekty (dodajemy końcówkę <strong className="text-white">-er</strong> lub <strong className="text-white">more</strong> oraz słówko <strong className="text-white">than</strong>). W stopniu najwyższym (Superlative) wskazujemy obiekt najwyższej cechy w grupie (używamy przedrostka <strong className="text-white">the</strong> oraz końcówki <strong className="text-white">-est</strong> lub <strong className="text-white">most</strong>).</p>
                      
                      <div className="space-y-1.5 pt-1 text-slate-400">
                        <div className="p-2.5 bg-slate-900 rounded-lg border border-slate-800">
                          <strong className="text-slate-200 block mb-0.5">1. Podwajanie spółgłoski (Short adjectives)</strong>
                          W krótkich przymiotnikach zakończonych spółgłoską poprzedzoną jedną samogłoską podwajamy ostatnią literę (np. <span className="text-white font-medium">big ➔ bigger ➔ the biggest</span>, <span className="text-white font-medium">hot ➔ hotter ➔ the hottest</span>).
                        </div>

                        <div className="p-2.5 bg-slate-900 rounded-lg border border-slate-800">
                          <strong className="text-slate-200 block mb-0.5">2. Przymiotniki na literę -y</strong>
                          W przymiotnikach zakończonych na <span className="text-white font-medium">-y</span> zamieniamy ją na <span className="text-white font-medium">-i</span> i dodajemy końcówki <span className="text-white font-medium">-er / -est</span> (np. <span className="text-white font-medium">happy ➔ happier ➔ the happiest</span>, <span className="text-white font-medium">easy ➔ easier ➔ the easiest</span>).
                        </div>

                        <div className="p-2.5 bg-slate-900 rounded-lg border border-slate-800">
                          <strong className="text-slate-200 block mb-0.5">3. Przymiotniki na literę -e</strong>
                          Jeśli przymiotnik kończy się na niemime <span className="text-white font-medium">-e</span>, dodajemy tylko <span className="text-white font-medium">-r</span> oraz <span className="text-white font-medium">-st</span> (np. <span className="text-white font-medium">safe ➔ safer ➔ the safest</span>).
                        </div>

                        <div className="p-2.5 bg-slate-900 rounded-lg border border-slate-800">
                          <strong className="text-slate-200 block mb-0.5">4. Przymiotniki długie (Long adjectives)</strong>
                          Długie przymiotniki (dwu- i wielosylabowe) stopniujemy za pomocą <span className="text-white font-medium">more</span> oraz <span className="text-white font-medium">the most</span> (np. <span className="text-white font-medium">expensive ➔ more expensive ➔ the most expensive</span>).
                        </div>

                        <div className="p-2.5 bg-slate-900 rounded-lg border border-slate-800">
                          <strong className="text-slate-200 block mb-0.5">5. Przymiotniki nieregularne (Irregular adjectives)</strong>
                          Wyjątki, które zmieniają formę całkowicie i należy je zapamiętać (np. <span className="text-white font-medium">good ➔ better ➔ the best</span>, <span className="text-white font-medium">bad ➔ worse ➔ the worst</span>, <span className="text-white font-medium">far ➔ further ➔ the furthest</span>).
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800 space-y-2">
                    <h3 className="font-bold text-blue-400 text-sm">Present Simple (Czas teraźniejszy prosty)</h3>
                    <div className="space-y-1.5 text-slate-300">
                      <p>Stosowany do rutyny, nawyków oraz faktów. Określniki: <em>always, usually, often, sometimes, never</em>.</p>
                      <p><strong>Wyjątki w 3. osobie liczby pojedynczej (he / she / it):</strong></p>
                      <ul className="list-disc pl-4 space-y-1 text-slate-400">
                        <li>Do czasowników kończących się na <em>-ch, -sh, -ss, -x, -o, -zz</em> dodajemy końcówkę <strong>-es</strong> (np. <em>watch ➔ watches, go ➔ goes</em>).</li>
                        <li>Gdy czasownik kończy się na spółgłoskę + <em>y</em>, usuwamy <em>y</em> i dodajemy <strong>-ies</strong> (np. <em>study ➔ studies, fly ➔ flies</em>). Jeśli przed <em>y</em> stoi samogłoska, dodajemy normalnie <em>-s</em> (np. <em>play ➔ plays</em>).</li>
                      </ul>
                    </div>
                  </div>

                  <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800 space-y-2">
                    <h3 className="font-bold text-blue-400 text-sm">Present Continuous (Czas teraźniejszy ciągły)</h3>
                    <div className="space-y-1.5 text-slate-300">
                      <p>Czynności wykonywane w tej chwili. Budowa: <em>am / is / are + czasownik z końcówką -ing</em>. Określniki: <em>now, at the moment, look!, listen!</em></p>
                      <p><strong>Wyjątki ortograficzne przy dodawaniu -ing:</strong></p>
                      <ul className="list-disc pl-4 space-y-1 text-slate-400">
                        <li>Niemime <em>-e</em> na końcu wyrazu znika (np. <em>write ➔ writing, dance ➔ dancing</em>). Wyjątek: <em>be ➔ being</em>.</li>
                        <li>W czasownikach jednosylabowych z krótką samogłoską między spółgłoskami podwajamy ostatnią spółgłoskę (np. <em>run ➔ running, swim ➔ swimming</em>).</li>
                        <li>Czasowniki zakończone na <em>-ie</em> zamieniają je na <em>-y</em> przed dodaniem <em>-ing</em> (np. <em>lie ➔ lying, die ➔ dying</em>).</li>
                      </ul>
                    </div>
                  </div>

                  <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800 space-y-2">
                    <h3 className="font-bold text-blue-400 text-sm">Past Simple (Czas przeszły prosty)</h3>
                    <div className="space-y-1.5 text-slate-300">
                      <p>Wydarzenia w pełni zamknięte w przeszłości. Określniki: <em>yesterday, last week, in 2018, ago</em>.</p>
                      <p><strong>Zasady i wyjątki czasowników regularnych (-ed):</strong></p>
                      <ul className="list-disc pl-4 space-y-1 text-slate-400">
                        <li>Jeśli czasownik kończy się na <em>-e</em>, dodajemy tylko <em>-d</em> (np. <em>smile ➔ smiled</em>).</li>
                        <li>Spółgłoska + <em>y</em> zamienia się w <em>-ied</em> (np. <em>cry ➔ cried</em>).</li>
                        <li>Krótkie czasowniki z jedną samogłoską na końcu podwajają spółgłoskę (np. <em>stop ➔ stopped</em>).</li>
                      </ul>
                      <p><em>Czasowniki nieregularne:</em> Nie podlegają regułom i należy je zapamiętać z tabeli (np. <em>go ➔ went, see ➔ saw, buy ➔ bought</em>).</p>
                    </div>
                  </div>

                  <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800 space-y-2">
                    <h3 className="font-bold text-blue-400 text-sm">Czasowniki Modalne i Pułapki</h3>
                    <div className="space-y-1.5 text-slate-300">
                      <p><strong>Can / Could:</strong> Wyrażają umiejętność. Nigdy nie przyjmują końcówki <em>-s</em> w 3. osobie l.poj. i występują z bezokolicznikiem bez <em>to</em> (np. <em>He can swim</em>).</p>
                      <p><strong>Must vs Have to:</strong> <em>Must</em> wyraża wewnętrzny nakaz, <em>have to</em> zewnętrzny obowiązek. <em>Pułapka:</em> <strong>mustn't</strong> oznacza absolutny zakaz (nie wolno!), a <strong>don't have to</strong> oznacza brak konieczności (nie musisz, ale możesz).</p>
                    </div>
                  </div>

                </div>
              )}

            </div>
          </div>

          <footer className={`w-full ${isMobileView ? 'max-w-sm' : 'max-w-5xl'} text-center py-1.5 text-[9px] text-slate-500 font-medium space-y-0.5 transition-all`}>
            <div>Ostatnia aktualizacja kodu (plik): <span className="text-slate-400 font-semibold">{fileLastModified}</span></div>
            <div>Angielski Master Junior 1.2 • Seria: Językowy Master</div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
